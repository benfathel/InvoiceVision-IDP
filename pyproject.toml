[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-idp"
version = "0.1.0"
description = "RPA/IDP mini-project for invoice PDF extraction and validation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PyMuPDF>=1.23,<2",
  "pytesseract>=0.3.10,<1",
  "Pillow>=10,<12",
  "openpyxl>=3.1,<4",
  "reportlab>=4,<5",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
invoice-idp = "invoice_idp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
